# Codemagic CI —— 替代 GitHub Actions 的 macOS 构建
# 免费额度：个人账号每月 500 分钟 macOS M2
# 产物：out/ZL2.ipa（未签名）+ 模拟器截图

workflows:
  ios-unsigned:
    name: ZL2 iOS 构建（未签名）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        SCHEME: ZL2iOS
        PROJECT: ZL2iOS.xcodeproj

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: 核对代码版本
        script: |
          echo "=== 当前构建的 commit ==="
          git log -1 --format='%H %s'
          echo "=== 关键文件行数 ==="
          wc -l src/ControlEditor.swift src/ControlLayoutModel.swift
          echo "=== loadLayout 位置 ==="
          grep -n "private func loadLayout" src/ControlEditor.swift || echo "未找到 loadLayout"

      - name: 显示工具链
        script: |
          xcodebuild -version
          swift --version
          cmake --version || brew install cmake

      - name: 安装 XcodeGen
        script: |
          brew install xcodegen
          xcodegen --version

      - name: 编译 Amethyst 核心（静态库）
        script: |
          set -e
          SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --sdk iphoneos -f clang)
          CLANGXX=$(xcrun --sdk iphoneos -f clang++)
          cd core
          cmake -B build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SYSROOT" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_C_COMPILER="$CLANG" \
            -DCMAKE_CXX_COMPILER="$CLANGXX" \
            -DCONFIG_RELEASE=1 \
            -DCONFIG_BRANCH=main \
            -DCONFIG_COMMIT=zl2 \
            -DCONFIG_CURSEFORGE_API_KEY= \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4 || cmake --build build --target ZL2Core -j 4
          ls -lh build/*.a build/*.dylib 2>/dev/null || true
          cd ..

      - name: 生成 Xcode 工程
        script: |
          xcodegen generate
          xcodebuild -list -project "$PROJECT"

      - name: 编译真机包（未签名）
        script: |
          set +e
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > /tmp/xcbuild.log 2>&1
          RC=$?
          echo "xcodebuild exit=$RC"
          # 把错误写进构建摘要（这样能从 GitHub 读取）
          ERRORS=$(grep -E "error:" /tmp/xcbuild.log | sort -u | head -40)
          if [ -n "$ERRORS" ]; then
            echo "## ❌ 编译错误（共 $(echo "$ERRORS" | wc -l) 条）" >> "$CM_BUILD_SUMMARY"
            echo '```' >> "$CM_BUILD_SUMMARY"
            echo "$ERRORS" >> "$CM_BUILD_SUMMARY"
            echo '```' >> "$CM_BUILD_SUMMARY"
            echo "=== ERRORS BEGIN ==="
            echo "$ERRORS"
            echo "=== ERRORS END ==="
          fi
          if [ $RC -ne 0 ]; then
            tail -60 /tmp/xcbuild.log
            exit 1
          fi

      - name: 打包资源与运行时
        script: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          test -n "$APP"

          mkdir -p "$APP/Frameworks"
          cp -R core/resources/Frameworks/. "$APP/Frameworks/"
          for f in core/resources/*.js; do
            [ -f "$f" ] && cp "$f" "$APP/" && echo "copied $(basename "$f")"
          done
          cp -R core/build/*.dylib "$APP/Frameworks/" 2>/dev/null || true

          # JRE 17 / 21 / 25（按 MC 版本自动选；MC 26+ 需要 25）
          for JV in 17 21 25; do
            mkdir -p "$APP/java_runtimes/java-${JV}-openjdk"
            curl -L --fail --retry 3 -o "/tmp/jre${JV}.zip" \
              "https://assets.angelauramc.dev/openjdk/ios-arm64/jre${JV}-ios-aarch64.zip"
            rm -rf "/tmp/jre${JV}" && mkdir -p "/tmp/jre${JV}"
            unzip -q -o "/tmp/jre${JV}.zip" -d "/tmp/jre${JV}"
            tar xf "/tmp/jre${JV}"/*.tar.xz -C "$APP/java_runtimes/java-${JV}-openjdk"
            echo "JRE $JV done"
          done

          ls "$APP/java_runtimes/java-17-openjdk/lib/libjli.dylib"
          du -sh "$APP"

      - name: 生成 IPA
        script: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          rm -rf Payload out && mkdir -p Payload out
          cp -R "$APP" Payload/
          zip -qry "out/ZL2.ipa" Payload
          ls -la out

      - name: 模拟器编译与截图
        ignore_failure: true
        script: |
          set +e
          mkdir -p out
          echo "=== 1. 模拟器编译 ==="
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_LDFLAGS="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="" \
            build > /tmp/simbuild.log 2>&1
          SIMRC=$?
          echo "sim build exit=$SIMRC"
          if [ $SIMRC -ne 0 ]; then
            echo "=== 模拟器编译错误 ==="
            grep -E "error:" /tmp/simbuild.log | head -20
            echo "=== 错误已写入构建摘要 ==="
            {
              echo "## 模拟器编译失败"
              echo '```'
              grep -E "error:" /tmp/simbuild.log | head -20
              echo '```'
            } >> "$CM_BUILD_SUMMARY"
            exit 0
          fi

          echo "=== 2. 选设备 ==="
          xcrun simctl list devices available | head -20
          DEVICE=$(xcrun simctl list devices available | grep -E 'iPhone 1[5-7]' | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          [ -z "$DEVICE" ] && DEVICE=$(xcrun simctl list devices available | grep 'iPhone' | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "DEVICE=$DEVICE"

          echo "=== 3. 启动模拟器 ==="
          xcrun simctl boot "$DEVICE" 2>&1 | head -3
          sleep 10

          APP=$(find build-sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then
            echo "没找到 .app，模拟器编译产物缺失"
            exit 0
          fi

          echo "=== 4. 安装 ==="
          xcrun simctl install "$DEVICE" "$APP" 2>&1 | head -5
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist" 2>/dev/null)
          echo "BUNDLE_ID=$BID"

          echo "=== 5. 启动 App ==="
          xcrun simctl launch "$DEVICE" "$BID" 2>&1 | head -5
          sleep 12

          echo "=== 6. 截图 ==="
          xcrun simctl io "$DEVICE" screenshot /tmp/raw.png 2>&1 | head -3
          if [ -f /tmp/raw.png ]; then
            cp /tmp/raw.png out/screenshot-raw.png
            sips -r 270 /tmp/raw.png --out out/screenshot-home.png 2>/dev/null || cp /tmp/raw.png out/screenshot-home.png
            echo "截图已保存"
            ls -la out/*.png
          else
            echo "截图失败"
          fi

          echo "=== 7. 应用日志 ==="
          xcrun simctl spawn "$DEVICE" log show --last 3m --predicate 'process == "ZL2"' 2>/dev/null | tail -50 > out/app-log.txt
          echo "日志行数: $(wc -l < out/app-log.txt)"

    artifacts:
      - out/ZL2.ipa
      - out/screenshot-home.png
      - out/app-log.txt
