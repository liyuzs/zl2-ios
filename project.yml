# XcodeGen 工程定义
# 用法（在 Mac 或 GitHub Actions 里）：
#   brew install xcodegen && xcodegen generate
# 会生成 ZL2iOS.xcodeproj，然后 xcodebuild 编译。

name: ZL2iOS

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  ZL2iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: src
        excludes:
          - "Info.plist"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.zl2ios
        PRODUCT_NAME: ZL2
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: src/ZL2Core-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/core
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ZL2_CORE_LINKED
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/core/build
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/core/resources/Frameworks
        OTHER_LDFLAGS: $(inherited) -lZL2Core -lAFNetworking -lawt_xawt -lawt_headless -ltinygl4angle -lAmethystAccountJNI -framework AltKit -framework CAltKit -framework UnzipKit -framework libEGL -framework libGLESv2 -framework AuthenticationServices -framework AVFoundation -framework CoreMotion -framework GameController -framework IOKit -framework QuartzCore -framework UniformTypeIdentifiers -framework WebKit -weak_framework SafariServices
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        SWIFT_EMIT_LOC_STRINGS: YES

    info:
      path: src/Info.plist
      properties:
        CFBundleDisplayName: ZL2
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false

schemes:
  ZL2iOS:
    build:
      targets:
        ZL2iOS: all
    run:
      config: Debug
    archive:
      config: Release
